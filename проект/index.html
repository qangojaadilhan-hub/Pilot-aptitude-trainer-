<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilot Aptitude Trainer</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main class="container">
    <section class="card" id="app">
      <div class="top">
        <div>
          <p class="label">APTITUDE TRAINER</p>
          <h1>✈️ Pilot Aptitude Trainer</h1>
        </div>
        <div class="score" id="progress">1 / 10</div>
      </div>

      <div class="bar"><div id="bar"></div></div>

      <p class="category" id="category"></p>
      <h2 id="question"></h2>
      <div id="answers" class="answers"></div>

      <button id="next" class="next" disabled>Next question →</button>
      <p id="feedback" class="feedback"></p>
    </section>

    <section class="card result hidden" id="result">
      <div class="plane">✈️</div>
      <h1>Test complete!</h1>
      <p class="big-score" id="finalScore"></p>
      <p id="message"></p>
      <button class="next" onclick="location.reload()">Try again</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
